<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo app</title>
</head>
    <body>
        <h1>Todo App</h1>

        <ul>
            {% for item in list %}
                <li>{{ item }}</li>
            {% endfor %}
        </ul>

        <form method="post">
            <input name="task" required>
            <button>Add task</button>
        </form>
    </body>
</html>
